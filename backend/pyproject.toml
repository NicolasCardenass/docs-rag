[project]
name = "docs-rag"
version = "0.1.0"
description = "Chat with your documents: retrieval-augmented generation API"
readme = "README.md"
license = "MIT"
authors = [{ name = "Nicolas Cardenas" }]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.162.7",
    "httpx2>=2.16.0",
    "openai>=3.51.0",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.0",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "hypothesis>=6.170.15",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docs_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["docs_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
